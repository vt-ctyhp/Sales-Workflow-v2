<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Workflow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-foundation: #F7F1EB;
        --surface-card: #FBF7F1;
        --surface-inset: #EFE8DD;
        --ink-primary: #2A2725;
        --ink-body: #4A4540;
        --ink-muted: #8A8178;
        --rule: #D4CFC4;
        --accent: #E91D79;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-foundation);
        color: var(--ink-body);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
      }

      .login-wrap {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      .login-panel {
        width: min(520px, 100%);
        background: var(--surface-card);
        border: 1px solid var(--rule);
        padding: 36px;
      }

      .eyebrow {
        color: var(--ink-muted);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink-primary);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 400;
        line-height: 1.05;
      }

      h1 {
        margin-top: 8px;
        font-size: 42px;
      }

      h2 {
        font-size: 30px;
      }

      h3 {
        font-size: 22px;
      }

      .rule {
        margin: 24px 0;
        border-top: 1px solid var(--rule);
      }

      label {
        display: block;
        margin-top: 20px;
      }

      label span {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--rule);
        border-radius: 0;
        background: transparent;
        color: var(--ink-primary);
        padding: 7px 2px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-bottom: 2px solid var(--accent);
        padding-bottom: 6px;
      }

      textarea {
        min-height: 72px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 24px;
      }

      .btn {
        min-height: 40px;
        border: 1px solid var(--ink-primary);
        border-radius: 2px;
        background: transparent;
        color: var(--ink-primary);
        padding: 11px 18px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: background-color 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out;
      }

      .btn:hover,
      .btn.is-active {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }

      .btn.primary {
        background: var(--ink-primary);
        color: var(--bg-foundation);
      }

      .btn.primary:hover {
        border-color: var(--accent);
        background: var(--accent);
      }

      .btn.small {
        min-height: 32px;
        padding: 7px 10px;
        font-size: 10px;
      }

      .btn:disabled {
        cursor: default;
        opacity: 0.5;
      }

      .error {
        margin-top: 16px;
        color: var(--accent);
      }

      .muted {
        color: var(--ink-muted);
      }

      .shell {
        max-width: 1320px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px;
      }

      .masthead {
        display: flex;
        gap: 24px;
        align-items: flex-end;
        justify-content: space-between;
        padding: 8px 0 28px;
      }

      .masthead h1 {
        font-size: 44px;
      }

      .masthead-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        justify-content: flex-end;
      }

      .user-chip {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-width: 220px;
      }

      .user-avatar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--ink-primary);
        color: var(--bg-foundation);
        font-size: 13px;
        font-weight: 500;
      }

      .user-name {
        display: block;
        overflow: hidden;
        color: var(--ink-primary);
        font-weight: 500;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .user-roles {
        display: block;
        overflow: hidden;
        margin-top: 3px;
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.12em;
        line-height: 1.2;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .toolbar-nav {
        display: flex;
        gap: 28px;
        align-items: stretch;
        justify-content: space-between;
        border-bottom: 1px solid var(--rule);
      }

      .nav-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        min-width: 0;
      }

      .nav-group {
        display: grid;
        gap: 8px;
        min-width: 120px;
        padding: 12px 0;
      }

      .nav-group-label {
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .nav-items {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
      }

      .nav-items button {
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--ink-muted);
        padding: 8px 0 10px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-align: left;
        text-transform: uppercase;
      }

      .nav-items button:hover,
      .nav-items button.is-active {
        color: var(--ink-primary);
        border-bottom-color: var(--ink-primary);
      }

      .toolbar-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: flex-end;
        padding: 14px 0;
      }

      .main {
        min-width: 0;
        padding-top: 24px;
      }

      .topbar {
        display: flex;
        gap: 24px;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 22px;
      }

      .status-line {
        min-height: 20px;
        margin-top: 8px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .content {
        margin-top: 24px;
      }

      .content.loading {
        border: 1px solid var(--rule);
        background: var(--surface-inset);
        padding: 24px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        margin-bottom: 24px;
      }

      .toolbar label {
        min-width: 180px;
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .grid.compact {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .metric,
      .panel {
        border: 1px solid var(--rule);
        background: var(--surface-card);
        padding: 20px;
      }

      .panel-header {
        border-bottom: 1px solid var(--rule);
        margin-bottom: 18px;
        padding-bottom: 14px;
      }

      .metric strong {
        display: block;
        color: var(--ink-primary);
        font-size: 28px;
        font-variant-numeric: tabular-nums;
        font-weight: 400;
      }

      .stat-value {
        color: var(--ink-primary);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 30px;
        line-height: 1;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.9fr);
        gap: 24px;
        align-items: start;
      }

      .split.wide-main {
        grid-template-columns: minmax(0, 1fr) minmax(360px, 430px);
      }

      .list-stack {
        display: grid;
        gap: 12px;
      }

      .pipeline-board {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .pipeline-column {
        border: 1px solid var(--rule);
        background: var(--surface-card);
        padding: 14px;
      }

      .pipeline-column-head {
        border-bottom: 1px solid var(--rule);
        margin-bottom: 10px;
        padding-bottom: 10px;
      }

      .task-card,
      .customer-card,
      .stone-card,
      .return-card,
      .activity-card {
        width: 100%;
        border: 1px solid var(--rule);
        background: var(--surface-card);
        color: var(--ink-body);
        padding: 18px;
        text-align: left;
      }

      .return-card {
        display: block;
        margin: 0;
      }

      .task-card:hover,
      .customer-card:hover,
      .stone-card:hover,
      .return-card:hover {
        background: var(--surface-inset);
      }

      .task-card.overdue,
      .return-card.issue,
      .stone-card.issue {
        border-top: 2px solid var(--accent);
      }

      .card-top {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
      }

      .card-main {
        min-width: 0;
      }

      .card-title {
        color: var(--ink-primary);
        font-size: 16px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .card-side {
        display: grid;
        gap: 8px;
        justify-items: end;
        min-width: 74px;
      }

      .meta {
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .badge,
      .brand-chip {
        display: inline-block;
        margin: 10px 8px 0 0;
        background: var(--surface-inset);
        color: var(--ink-body);
        font-size: 10px;
        letter-spacing: 0.12em;
        line-height: 1;
        padding: 5px 7px;
        text-transform: uppercase;
      }

      .brand-chip.hp {
        border: 1px solid #F3B8D5;
        background: #FCEAF3;
        color: #A71358;
      }

      .brand-chip.vvs {
        border: 1px solid #E8C75C;
        background: #FFF4CC;
        color: #725500;
      }

      .detail-section {
        border-bottom: 1px solid var(--rule);
        padding-bottom: 18px;
        margin-bottom: 18px;
      }

      .detail-section:last-child {
        border-bottom: 0;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .task-form {
        display: grid;
        gap: 18px;
      }

      .field-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field-grid.one {
        grid-template-columns: 1fr;
      }

      .form-message {
        min-height: 20px;
        color: var(--ink-muted);
        font-size: 12px;
      }

      .form-message.error {
        color: var(--accent);
      }

      .template-box {
        min-height: 0;
        background: var(--surface-inset);
        color: var(--ink-primary);
        line-height: 1.55;
        overflow-wrap: anywhere;
        padding: 16px;
        white-space: pre-wrap;
      }

      .link-list {
        display: grid;
        gap: 10px;
      }

      .link-tile {
        display: block;
        border: 1px solid var(--rule);
        background: var(--surface-inset);
        color: #0A5CA8;
        overflow-wrap: anywhere;
        padding: 12px;
        text-decoration: none;
      }

      .link-tile:hover {
        border-color: var(--ink-primary);
        color: var(--ink-primary);
      }

      .customer-hero {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(0, 1fr) auto;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 20px;
        margin-bottom: 20px;
      }

      .customer-hero h3 {
        font-size: 34px;
        overflow-wrap: anywhere;
      }

      .section-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .section-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mini-table {
        border-top: 1px solid var(--rule);
        display: grid;
      }

      .mini-row {
        display: grid;
        gap: 12px;
        grid-template-columns: minmax(0, 1fr) auto;
        border-bottom: 1px solid var(--rule);
        padding: 12px 0;
      }

      .mini-row:last-child {
        border-bottom: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface-card);
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid var(--rule);
        padding: 11px 12px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: var(--surface-inset);
        color: var(--ink-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      tr:hover td {
        background: var(--surface-inset);
      }

      .number {
        font-variant-numeric: tabular-nums;
      }

      .row-link {
        border: 0;
        background: transparent;
        color: var(--ink-primary);
        padding: 0;
        text-align: left;
      }

      .detail-list {
        display: grid;
        gap: 14px;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        gap: 16px;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 12px;
      }

      .detail-row span:first-child {
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .empty,
      .loading {
        border: 1px solid var(--rule);
        background: var(--surface-inset);
        padding: 24px;
      }

      .loading .eyebrow {
        display: block;
      }

      .calendar-nav {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }

      .calendar-month {
        color: var(--ink-primary);
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 28px;
      }

      .calendar-days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        border-left: 1px solid var(--rule);
        border-top: 1px solid var(--rule);
        background: var(--surface-card);
      }

      .calendar-weekday {
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        background: var(--surface-inset);
        color: var(--ink-muted);
        font-size: 10px;
        letter-spacing: 0.14em;
        padding: 9px 8px;
        text-transform: uppercase;
      }

      .day {
        min-height: 132px;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        background: var(--surface-card);
        padding: 8px;
      }

      .day.outside {
        background: var(--bg-foundation);
      }

      .day.today {
        background: var(--surface-inset);
      }

      .day-num {
        color: var(--ink-muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .appt {
        display: block;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--rule);
        background: transparent;
        color: var(--ink-body);
        margin-top: 7px;
        padding: 6px 0;
        font-size: 12px;
        line-height: 1.35;
        text-align: left;
      }

      .appt:hover {
        color: var(--ink-primary);
      }

      .form-card {
        border: 1px solid var(--rule);
        background: var(--surface-card);
        padding: 22px;
      }

      .check-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-top: 10px;
      }

      .check-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0;
        color: var(--ink-body);
        font-size: 13px;
        letter-spacing: 0;
        text-transform: none;
      }

      .check-row input {
        width: auto;
        margin-top: 2px;
      }

      @media (max-width: 980px) {
        .split {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid.compact,
        .section-grid,
        .section-grid.two,
        .field-grid {
          grid-template-columns: 1fr;
        }

        .masthead,
        .toolbar-nav,
        .topbar,
        .customer-hero {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar-actions {
          justify-content: flex-start;
          padding-top: 0;
        }
      }

      @media (max-width: 620px) {
        .main,
        .shell,
        .login-panel {
          padding: 24px;
        }

        .topbar,
        .actions {
          display: block;
        }

        .actions .btn {
          margin-top: 8px;
          width: 100%;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .calendar-days {
          grid-template-columns: 1fr;
        }

        .calendar-weekday,
        .day.outside {
          display: none;
        }

        .day {
          border-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script>
      const STORAGE_KEY = 'salesWorkflowToken';
      const VIEW_LABELS = {
        tasks: 'Tasks',
        myQueue: 'My Queue',
        coverage: 'JOC Coverage',
        jocCoverage: 'JOC Coverage',
        cleanup: 'Cleanup',
        customers: 'Customers',
        customerSearch: 'Customer Search',
        customerPipeline: 'Customer Pipeline',
        calendar: 'Calendar',
        diamonds: 'Diamonds',
        diamondInventory: 'Diamond Inventory',
        diamondTracking: 'Diamond Tracking',
        bulkReturns: 'Bulk Returns',
        payments: 'Payments',
        admin: 'Admin',
        adminReview: 'Admin Review',
        schedules: 'Schedules',
        users: 'Manage Users',
        manageUsers: 'Manage Users',
        diagnostics: 'Diagnostics'
      };
      const ADMIN_VIEWS = ['admin', 'adminReview', 'schedules', 'manageUsers'];
      const DIAMOND_VIEWS = ['bulkReturns'];
      const VIEW_PERMISSIONS = {
        myQueue: 'Api.tasks.list',
        calendar: 'Api.calendar.getMonth',
        customerSearch: 'Api.customers.search',
        customerPipeline: 'Api.customers.search',
        diamondInventory: 'Api.diamonds.inStock',
        diamondTracking: 'Api.diamonds.tracking',
        bulkReturns: 'Api.diamonds.bulkReturnCandidates',
        payments: 'Api.payments.history',
        admin: 'Api.admin.dashboard',
        adminReview: 'Api.admin.dashboard',
        schedules: 'Api.schedules.list',
        manageUsers: 'Api.users.list',
        diagnostics: 'Api.diag.driftReport'
      };
      const NAV_GROUPS = [
        { label: 'Work', views: ['myQueue', 'jocCoverage', 'cleanup', 'calendar'] },
        { label: 'Customers', views: ['customerSearch', 'customerPipeline'] },
        { label: 'Diamonds', views: ['diamondInventory', 'diamondTracking', 'bulkReturns'] },
        { label: 'Admin', views: ['admin', 'adminReview', 'schedules', 'manageUsers'] },
        { label: 'Support', views: ['payments', 'diagnostics'] }
      ];
      const VIEW_ALIASES = {
        tasks: 'myQueue',
        coverage: 'jocCoverage',
        customers: 'customerSearch',
        diamonds: 'diamondInventory',
        users: 'manageUsers'
      };
      const ROLE_OPTIONS = ['Admin', 'Client Advisor', 'JOC', 'Diamond Order Admin', 'Diamond Order Assistant', 'Read-Only Viewer'];
      const WRITEBACK_TASK_TYPES = [
        'POST_CONSULT_CLIENT_STATUS',
        'START_3D_DESIGN',
        'RECORD_3D_DEADLINE',
        'REQUEST_WAX_PRINT',
        'UPDATE_WAX_REQUEST',
        'APPOINTMENT_DAY_CHECKLIST',
        'APPROVE_RECAP_MESSAGE',
        'SEND_FINAL_RECAP',
        'PROPOSE_DIAMONDS',
        'ORDER_DIAMONDS',
        'TRACK_DIAMONDS',
        'CONFIRM_DIAMOND_DELIVERY',
        'RECORD_DIAMOND_DECISIONS',
        'RETURN_DIAMONDS'
      ];
      const state = {
        token: sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem('salesWorkflow.sessionToken') || '',
        user: null,
        visibleViews: [],
        view: 'myQueue',
        busy: false,
        status: '',
        data: {},
        selected: {},
        clientTimings: [],
        uploadPoll: null,
        uploadPollStartedAt: 0,
        uploadPollTaskId: ''
      };

      document.addEventListener('DOMContentLoaded', init);

      function init() {
        if (!state.token) {
          renderLogin();
          return;
        }
        boot();
      }

      function server(name, ...args) {
        return new Promise((resolve, reject) => {
          const started = performance.now();
          const runner = google.script.run
            .withSuccessHandler(response => {
              recordTiming(name, started, response);
              resolve(response);
            })
            .withFailureHandler(error => {
              recordTiming(name, started, null, error);
              reject(error);
            });
          runner[name](...args);
        });
      }

      async function boot() {
        setBusy(true, 'Loading dashboard');
        try {
          const response = await server('webBootstrap', state.token);
          if (!response || !response.ok) {
            throw new Error(errorMessage(response));
          }
          const payload = response.data || {};
          state.user = payload.user;
          state.visibleViews = effectiveViews(payload.visibleViews || ['tasks'], payload.permissions || {});
          state.view = state.visibleViews.indexOf(state.view) === -1 ? state.visibleViews[0] : state.view;
          state.data.bootstrap = payload;
          renderShell();
          await loadView(state.view);
        } catch (error) {
          sessionStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem('salesWorkflow.sessionToken');
          state.token = '';
          renderLogin(error.message);
        } finally {
          setBusy(false, '');
        }
      }

      function renderLogin(message) {
        document.getElementById('app').innerHTML = `
          <div class="login-wrap">
            <section class="login-panel">
              <div class="eyebrow">Sales Workflow</div>
              <h1>Operations Dashboard</h1>
              <div class="rule"></div>
              <form id="login-form">
                <label><span>Email</span><input id="login-email" type="email" autocomplete="username" required></label>
                <label><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label>
                ${message ? `<div class="error">${escapeHtml(message)}</div>` : ''}
                <div class="actions">
                  <button class="btn primary" type="submit">Sign In</button>
                  <button class="btn" type="button" id="show-bootstrap">Create Admin</button>
                </div>
              </form>
              <form id="bootstrap-form" style="display:none">
                <div class="rule"></div>
                <div class="eyebrow">First Admin</div>
                <label><span>Name</span><input id="bootstrap-name" type="text"></label>
                <label><span>Email</span><input id="bootstrap-email" type="email" required></label>
                <label><span>Password</span><input id="bootstrap-password" type="password" minlength="8" required></label>
                <div class="actions">
                  <button class="btn primary" type="submit">Create Admin</button>
                </div>
              </form>
            </section>
          </div>`;
        document.getElementById('login-form').addEventListener('submit', onLogin);
        document.getElementById('show-bootstrap').addEventListener('click', () => {
          document.getElementById('bootstrap-form').style.display = 'block';
        });
        document.getElementById('bootstrap-form').addEventListener('submit', onBootstrapAdmin);
      }

      async function onLogin(event) {
        event.preventDefault();
        setBusy(true, 'Signing in');
        try {
          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          const response = await server('webLogin', email, password);
          if (!response || !response.ok) {
            throw new Error(errorMessage(response));
          }
          state.token = response.data.session.token;
          sessionStorage.setItem(STORAGE_KEY, state.token);
          localStorage.removeItem('salesWorkflow.sessionToken');
          state.user = response.data.user;
          let bootstrap = response.data.bootstrap || {};
          if (!bootstrap.visibleViews) {
            const bootstrapResponse = await server('webBootstrap', state.token);
            if (!bootstrapResponse || !bootstrapResponse.ok) {
              throw new Error(errorMessage(bootstrapResponse));
            }
            bootstrap = bootstrapResponse.data || {};
          }
          state.visibleViews = effectiveViews(bootstrap.visibleViews || ['tasks'], bootstrap.permissions || {});
          state.user = bootstrap.user || state.user;
          state.data.bootstrap = bootstrap;
          state.view = state.visibleViews[0] || 'tasks';
          renderShell();
          await loadView(state.view);
        } catch (error) {
          renderLogin(error.message);
        } finally {
          setBusy(false, '');
        }
      }

      async function onBootstrapAdmin(event) {
        event.preventDefault();
        setBusy(true, 'Creating admin');
        try {
          const payload = {
            name: document.getElementById('bootstrap-name').value,
            email: document.getElementById('bootstrap-email').value,
            password: document.getElementById('bootstrap-password').value
          };
          const response = await server('webBootstrapAdmin', payload);
          if (!response || !response.ok) {
            throw new Error(errorMessage(response));
          }
          renderLogin('Admin created. Sign in with the credentials you just entered.');
        } catch (error) {
          renderLogin(error.message);
          document.getElementById('bootstrap-form').style.display = 'block';
        } finally {
          setBusy(false, '');
        }
      }

      function renderShell() {
        const displayName = state.user && (state.user.name || state.user.email) || '';
        const roleText = (state.user && state.user.roles || []).join(', ') || 'Workflow User';
        document.getElementById('app').innerHTML = `
          <div class="shell">
            <header class="masthead">
              <div>
                <div class="eyebrow">Sales Workflow</div>
                <h1>Team Queue</h1>
              </div>
              <div class="masthead-actions">
                <div class="user-chip">
                  <span class="user-avatar">${escapeHtml(userInitials(displayName))}</span>
                  <span>
                    <span class="user-name">${escapeHtml(displayName)}</span>
                    <span class="user-roles">${escapeHtml(roleText)}</span>
                  </span>
                </div>
                <button class="btn small" id="logout" type="button">Sign Out</button>
              </div>
            </header>
            <section class="toolbar-nav">
              <nav class="nav-groups" aria-label="Dashboard navigation">
                ${navGroupsHtml()}
              </nav>
              <div class="toolbar-actions">
                <button class="btn primary" id="refresh" type="button">Refresh</button>
              </div>
            </section>
            <main class="main">
              <div class="topbar">
                <div>
                  <div class="eyebrow">${escapeHtml(VIEW_LABELS[state.view] || state.view)}</div>
                  <h2>${escapeHtml(titleForView(state.view))}</h2>
                  <div id="status" class="status-line">${escapeHtml(state.status || '')}</div>
                </div>
              </div>
              <section id="content" class="content loading"><span class="eyebrow">Loading</span></section>
            </main>
          </div>`;
        document.querySelectorAll('[data-view]').forEach(button => {
          button.addEventListener('click', () => {
            clearUploadPoll();
            state.view = button.dataset.view;
            renderShell();
            loadView(state.view);
          });
        });
        document.getElementById('refresh').addEventListener('click', () => {
          clearUploadPoll();
          loadView(state.view);
        });
        document.getElementById('logout').addEventListener('click', onLogout);
      }

      function navGroupsHtml() {
        const visible = state.visibleViews || [];
        return NAV_GROUPS.map(group => {
          const views = group.views.filter(view => visible.indexOf(view) !== -1);
          if (!views.length) return '';
          return `
            <div class="nav-group">
              <div class="nav-group-label">${escapeHtml(group.label)}</div>
              <div class="nav-items">
                ${views.map(view => `<button class="${view === state.view ? 'is-active' : ''}" data-view="${escapeAttr(view)}" type="button">${escapeHtml(VIEW_LABELS[view] || titleCase(view))}</button>`).join('')}
              </div>
            </div>`;
        }).join('');
      }

      function userInitials(value) {
        const parts = String(value || '').replace(/@.*/, '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return 'U';
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      async function onLogout() {
        try {
          clearUploadPoll();
          await server('webLogout', state.token);
        } finally {
        sessionStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem('salesWorkflow.sessionToken');
          state.token = '';
          state.user = null;
          renderLogin();
        }
      }

      async function loadView(view) {
        clearUploadPoll();
        setContent(`<div class="loading"><span class="eyebrow">Loading</span></div>`, true);
        setStatus('Loading ' + (VIEW_LABELS[view] || view));
        try {
          if (view === 'tasks' || view === 'myQueue') await loadTasks({ view: 'mine' });
          else if (view === 'coverage' || view === 'jocCoverage') await loadTasks({ view: 'coverage' });
          else if (view === 'cleanup') await loadTasks({ view: 'cleanup' });
          else if (view === 'customers' || view === 'customerSearch') await loadCustomers('', 'search');
          else if (view === 'customerPipeline') await loadCustomers('', 'pipeline');
          else if (view === 'calendar') await loadCalendar();
          else if (view === 'diamonds' || view === 'diamondInventory') await loadDiamonds('inventory');
          else if (view === 'diamondTracking') await loadDiamonds('tracking');
          else if (view === 'bulkReturns') await loadBulkReturns();
          else if (view === 'payments') {
            renderPayments();
            setStatus('Ready');
            return;
          }
          else if (view === 'admin') await loadAdmin();
          else if (view === 'adminReview') await loadAdminReview();
          else if (view === 'schedules') await loadSchedules();
          else if (view === 'users' || view === 'manageUsers') await loadUsers();
          else if (view === 'diagnostics') await loadDiagnostics();
          setStatus('Ready' + latestTimingLabel());
        } catch (error) {
          setContent(`<div class="empty"><h3>Unable to load</h3><p class="error">${escapeHtml(error.message)}</p></div>`);
          setStatus('Error');
        }
      }

      async function loadTasks(view) {
        const taskView = view || state.data.taskView || { view: 'mine' };
        state.data.taskView = taskView;
        const response = await requireOk(server('webTasksList', taskView, state.token));
        const data = response.data || {};
        state.data.tasks = data;
        setContent(`
          <div class="toolbar">
            <label><span>View</span>
              <select id="task-view">
                ${taskViewOptions(taskView.view)}
              </select>
            </label>
          </div>
          <div class="grid compact">
            ${metric('Total', data.count || 0)}
            ${metric('Open', data.counts && data.counts.open || 0)}
            ${metric('Claimed', data.counts && data.counts.claimed || 0)}
            ${metric('Snoozed', data.counts && data.counts.snoozed || 0)}
            ${metric('Blocked', data.counts && data.counts.blocked || 0)}
          </div>
          <div class="content split wide-main">
            <div>${taskTable(data.tasks || [])}</div>
            <div id="task-detail" class="panel">${emptyPanel('Select a task')}</div>
          </div>`);
        document.getElementById('task-view').addEventListener('change', event => {
          loadTasks({ view: event.target.value });
        });
        bindTaskActions();
      }

      function taskTable(rows) {
        if (!rows.length) return `<div class="empty"><h3>No tasks</h3><p class="muted">The current queue is empty.</p></div>`;
        return `<div class="list-stack">
          ${rows.map(row => {
            const dueValue = row.snoozedUntil || row.dueAt;
            const overdue = isOverdue(dueValue) && row.taskState !== 'SNOOZED';
            return `<button class="task-card ${overdue ? 'overdue' : ''}" type="button" data-task="${escapeAttr(row.taskId)}">
              <div class="card-top">
                <div class="card-main">
                  <div class="card-title">${escapeHtml(taskTypeLabel(row.taskType))}</div>
                  <div class="meta">${escapeHtml(row.customer && row.customer.customerName || row.rootApptId || 'No customer')} · ${escapeHtml(row.rootApptId || '')}</div>
                  <div class="meta">Owner: ${escapeHtml(row.ownerName || row.ownerEmail || row.ownerRole || 'Unassigned')}</div>
                </div>
                <div class="card-side">
                  ${brandChip(row.customer && row.customer.brand)}
                  <div class="meta number">${escapeHtml(fmtDate(dueValue))}</div>
                </div>
              </div>
              <span class="badge">${escapeHtml(row.taskState || '')}</span>
              <span class="badge">${escapeHtml(row.ownerRole || '')}</span>
              ${row.blockReason ? `<div class="error">${escapeHtml(row.blockReason)}</div>` : ''}
              ${row.status && row.status.nextSteps ? `<div class="meta">${escapeHtml(row.status.nextSteps)}</div>` : ''}
            </button>`;
          }).join('')}
        </div>`;
      }

      function bindTaskActions() {
        document.querySelectorAll('[data-task]').forEach(button => {
          button.addEventListener('click', () => showTask(button.dataset.task));
        });
      }

      async function showTask(taskId) {
        clearUploadPoll();
        const detailEl = document.getElementById('task-detail');
        if (detailEl) detailEl.innerHTML = `<div class="loading"><span class="eyebrow">Loading</span></div>`;
        const response = await requireOk(server('webTaskDetail', taskId, state.token));
        const data = response.data || {};
        state.data.currentTaskDetail = data;
        renderTaskDetail(data);
      }

      function renderTaskDetail(data) {
        const task = data.task || {};
        const detailEl = document.getElementById('task-detail');
        if (!detailEl) return;
        detailEl.innerHTML = taskDetailHtml(data);
        bindTaskDetailActions();
      }

      function taskDetailHtml(data) {
        const task = data.task || {};
        const customer = data.customer && data.customer.sections || {};
        const identity = customer.identity || {};
        const status = customer.status || {};
        const owners = customer.owners || {};
        const order3d = customer.order3d || {};
        const appointment = customer.currentAppointment && customer.currentAppointment.appointment || {};
        const template = data.template || {};
        const closed = isClosedTask(task);
        const dueValue = task.SnoozedUntil || task.DueAt;
        return `
          <div class="panel-header">
            <div class="eyebrow">${escapeHtml(task.TaskState || 'Task Detail')}</div>
            <h3>${escapeHtml(taskTypeLabel(task.TaskType || task.TaskID))}</h3>
            <div style="margin-top:8px">
              <span class="badge">${escapeHtml(task.OwnerRole || 'Unassigned')}</span>
              ${task.TemplateKey ? `<span class="badge">${escapeHtml(task.TemplateKey)}</span>` : ''}
            </div>
          </div>
          <div class="detail-section">
            <div class="customer-hero">
              <div>
                <div class="eyebrow">Customer</div>
                <h3>${escapeHtml(identity.customerName || task.RootApptID || 'No customer')}</h3>
                <div class="meta">${escapeHtml([identity.brand, identity.email, identity.phone].filter(Boolean).join(' | '))}</div>
              </div>
              <div>${brandChip(identity.brand)}</div>
            </div>
            <div class="detail-list">
              ${detailRow('Root', task.RootApptID)}
              ${detailRow('Appointment', [appointment.date, appointment.time, appointment.visitType].filter(Boolean).join(' | '))}
              ${detailRow('Owner', task.OwnerName || task.OwnerEmail || task.OwnerRole)}
              ${detailRow('Due', fmtDate(dueValue))}
              ${detailRow('Version', task.Version)}
            </div>
          </div>
          <div class="detail-section">
            <div class="eyebrow">Customer State</div>
            <div class="detail-list" style="margin-top:12px">
              ${detailRow('Sales Stage', status.salesStage)}
              ${detailRow('Next Steps', status.nextSteps)}
              ${detailRow('3D Deadline', fmtDate(status.deadline3D))}
              ${detailRow('SO Number', order3d.SONumber || order3d.soNumber)}
              ${detailRow('Advisor', owners.clientAdvisorName || owners.clientAdvisorEmail)}
              ${detailRow('JOC', owners.jocOwnerName || owners.jocOwnerEmail)}
            </div>
          </div>
          ${taskTemplateHtml(template)}
          ${taskCompletionHtml(data, closed)}
          ${artifactUploadPanel(task.TaskID, task.RootApptID)}`;
      }

      function taskTemplateHtml(template) {
        if (!template || !template.TemplateKey) return '';
        return `
          <div class="detail-section">
            <div class="eyebrow">Template</div>
            <div class="detail-list" style="margin-top:12px">
              ${detailRow('Subject', template.Subject)}
              ${detailRow('Channel', template.Channel)}
            </div>
            ${template.Body ? `<div class="template-box" style="margin-top:12px">${escapeHtml(template.Body)}</div>` : ''}
          </div>`;
      }

      function taskCompletionHtml(data, closed) {
        const task = data.task || {};
        if (closed) {
          return `<div class="detail-section"><div class="empty"><h3>Task closed</h3><p class="muted">Completed and canceled tasks cannot be completed again.</p></div></div>`;
        }
        const writeback = isWritebackTask(task.TaskType);
        const actionLabel = writeback ? 'Complete' : 'Acknowledge';
        return `
          <div class="detail-section">
            <div class="eyebrow">${writeback ? 'Completion' : 'Acknowledgement'}</div>
            <form id="task-completion-form" class="task-form" data-task-type="${escapeAttr(task.TaskType || '')}" style="margin-top:12px">
              ${writeback ? taskCompletionFieldsHtml(data) : '<div class="template-box">Acknowledge this task after the external work is done.</div>'}
              <div id="task-form-message" class="form-message"></div>
              <div class="actions">
                <button class="btn small" type="button" data-task-action="claim" data-id="${escapeAttr(task.TaskID)}" data-version="${escapeAttr(task.Version)}">Claim</button>
                <button class="btn small" type="button" data-task-action="snooze" data-id="${escapeAttr(task.TaskID)}" data-version="${escapeAttr(task.Version)}">Snooze</button>
                <button class="btn primary small" type="submit" data-task-action="${writeback ? 'complete' : 'ack'}" data-id="${escapeAttr(task.TaskID)}" data-version="${escapeAttr(task.Version)}">${escapeHtml(actionLabel)}</button>
              </div>
            </form>
          </div>`;
      }

      function bindTaskDetailActions() {
        const form = document.getElementById('task-completion-form');
        if (form) {
          form.addEventListener('submit', event => {
            event.preventDefault();
            const button = form.querySelector('button[type="submit"]');
            if (button) runTaskAction(button.dataset.taskAction, button.dataset.id, button.dataset.version);
          });
        }
        document.querySelectorAll('#task-detail button[type="button"][data-task-action]').forEach(button => {
          button.addEventListener('click', () => runTaskAction(button.dataset.taskAction, button.dataset.id, button.dataset.version));
        });
        document.querySelectorAll('[data-artifact-action]').forEach(button => {
          button.addEventListener('click', () => runArtifactAction(button.dataset.artifactAction, button.dataset.task, button.dataset.root));
        });
      }

      async function runTaskAction(action, taskId, version) {
        if (!taskId || state.busy) return;
        setTaskSaving(true, 'Saving task');
        try {
          if (action === 'claim') await taskMutation('webTaskClaim', [taskId, Number(version), state.token], taskId);
          if (action === 'ack') await taskMutation('webTaskAcknowledge', [taskId, Number(version), state.token], taskId);
          if (action === 'complete') {
            const payload = buildTaskCompletionPayload(state.data.currentTaskDetail || {});
            await taskMutation('webTaskComplete', [taskId, payload, Number(version), state.token], taskId);
          }
          if (action === 'snooze') {
            const until = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
            await taskMutation('webTaskSnooze', [taskId, until, 'Snoozed from dashboard', Number(version), state.token], taskId);
          }
          await loadTasks(state.data.taskView);
          setStatus('Ready' + latestTimingLabel());
        } catch (error) {
          setTaskMessage(error.message, true);
          setStatus(error.conflict ? 'Conflict' : 'Task update failed');
        } finally {
          setTaskSaving(false, '');
        }
      }

      function taskCompletionFieldsHtml(data) {
        const task = data.task || {};
        const customer = data.customer && data.customer.sections || {};
        const status = customer.status || {};
        const order3d = customer.order3d || {};
        const stones = customer.diamondViewing && customer.diamondViewing.stones || [];
        const payload = task.PayloadJson || {};
        const type = task.TaskType || '';
        if (type === 'POST_CONSULT_CLIENT_STATUS') {
          return `<div class="field-grid">
            ${selectField('SalesStage', 'Sales Stage', status.salesStage || 'Consult Complete', ['New Lead', 'Appointment Booked', 'Consult Complete', 'Quote Sent', 'Deposit Received', 'In Production', 'Complete', 'Lost'])}
            ${inputField('NextSteps', 'Next Steps', status.nextSteps || '')}
          </div>`;
        }
        if (type === 'START_3D_DESIGN') {
          return `<div class="field-grid one">
            ${inputField('SONumber', 'SO Number', order3d.SONumber || '')}
            ${inputField('OdooUrl', 'Odoo URL', order3d.OdooUrl || order3d.odooUrl || '', 'url')}
            ${textareaField('DesignRequest', 'Design Request', order3d.DesignRequest || '')}
          </div>`;
        }
        if (type === 'RECORD_3D_DEADLINE') {
          return `<div class="field-grid">
            ${inputField('Deadline3D', '3D Deadline', dateInputValue(status.deadline3D), 'date')}
            ${inputField('Deadline3DMoveReason', 'Move Reason', '')}
          </div>`;
        }
        if (type === 'REQUEST_WAX_PRINT' || type === 'UPDATE_WAX_REQUEST') {
          return `<div class="field-grid one">
            ${inputField('RequestStatus', 'Request Status', type === 'REQUEST_WAX_PRINT' ? 'Requested' : '')}
            ${inputField('AdminDeadline', 'Admin Deadline', '', 'date')}
            ${inputField('RequestUrl', 'Request URL', '', 'url')}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'APPOINTMENT_DAY_CHECKLIST') {
          return `<div class="field-grid">
            ${selectField('Outcome', 'Outcome', 'completed', ['completed', 'no_show', 'canceled'])}
            ${inputField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'APPROVE_RECAP_MESSAGE' || type === 'SEND_FINAL_RECAP') {
          return `<div class="field-grid one">
            ${inputField('ArtifactID', 'Artifact ID', payload.artifactId || payload.ArtifactID || '')}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'PROPOSE_DIAMONDS') {
          return `<div class="field-grid one">
            ${stoneIdsField(type, stones)}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'ORDER_DIAMONDS') {
          return `<div class="field-grid one">
            ${stoneIdsField(type, stones)}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'TRACK_DIAMONDS') {
          return `<div class="field-grid one">
            ${stoneIdsField(type, stones)}
            <div class="field-grid">
              ${inputField('TrackingETA', 'Tracking ETA', '', 'datetime-local')}
              ${inputField('TrackingStatus', 'Tracking Status', '')}
              ${inputField('Carrier', 'Carrier', '')}
              ${inputField('TrackingNumber', 'Tracking Number', '')}
            </div>
            ${inputField('TrackingUrl', 'Tracking URL', '', 'url')}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'CONFIRM_DIAMOND_DELIVERY') {
          return `<div class="field-grid one">
            ${stoneIdsField(type, stones)}
            ${inputField('MemoDate', 'Memo Date', dateInputValue(new Date()), 'date')}
            ${textareaField('Notes', 'Notes', '')}
          </div>`;
        }
        if (type === 'RECORD_DIAMOND_DECISIONS') {
          return `<div class="field-grid one">
            ${textareaField('decisions', 'Decisions', suggestedStoneIds(type, stones).map(id => id + ': ').join('\n'))}
          </div>`;
        }
        if (type === 'RETURN_DIAMONDS') {
          return `<div class="field-grid one">
            ${stoneIdsField(type, stones)}
            ${textareaField('ReturnNotes', 'Return Notes', '')}
          </div>`;
        }
        return '<div class="template-box">No writeback fields are configured for this task.</div>';
      }

      function buildTaskCompletionPayload(data) {
        const task = data.task || {};
        const type = task.TaskType || '';
        if (type === 'POST_CONSULT_CLIENT_STATUS') return pickFields(['SalesStage', 'NextSteps']);
        if (type === 'START_3D_DESIGN') return pickFields(['SONumber', 'OdooUrl', 'DesignRequest']);
        if (type === 'RECORD_3D_DEADLINE') return pickFields(['Deadline3D', 'Deadline3DMoveReason']);
        if (type === 'REQUEST_WAX_PRINT' || type === 'UPDATE_WAX_REQUEST') return pickFields(['RequestStatus', 'AdminDeadline', 'RequestUrl', 'Notes']);
        if (type === 'APPOINTMENT_DAY_CHECKLIST') return pickFields(['Outcome', 'Notes']);
        if (type === 'APPROVE_RECAP_MESSAGE' || type === 'SEND_FINAL_RECAP') return pickFields(['ArtifactID', 'Notes']);
        if (type === 'PROPOSE_DIAMONDS') {
          const stoneIds = parseTokenList(fieldValue('stoneIds'));
          return Object.assign(pickFields(['Notes']), {
            stoneIds,
            stones: stoneIds.map(id => ({ CertNo: id }))
          });
        }
        if (type === 'ORDER_DIAMONDS') return Object.assign(pickFields(['Notes']), { stoneIds: parseTokenList(fieldValue('stoneIds')) });
        if (type === 'TRACK_DIAMONDS') return Object.assign(pickFields(['TrackingETA', 'TrackingStatus', 'Carrier', 'TrackingNumber', 'TrackingUrl', 'Notes']), { stoneIds: parseTokenList(fieldValue('stoneIds')) });
        if (type === 'CONFIRM_DIAMOND_DELIVERY') return Object.assign(pickFields(['MemoDate', 'Notes']), { stoneIds: parseTokenList(fieldValue('stoneIds')) });
        if (type === 'RECORD_DIAMOND_DECISIONS') return { decisions: parseDecisionLines(fieldValue('decisions')) };
        if (type === 'RETURN_DIAMONDS') return Object.assign(pickFields(['ReturnNotes']), { stoneIds: parseTokenList(fieldValue('stoneIds')) });
        return {};
      }

      function inputField(id, label, value, type) {
        return `<label><span>${escapeHtml(label)}</span><input id="task-field-${escapeAttr(id)}" type="${escapeAttr(type || 'text')}" value="${escapeAttr(value || '')}"></label>`;
      }

      function textareaField(id, label, value) {
        return `<label><span>${escapeHtml(label)}</span><textarea id="task-field-${escapeAttr(id)}">${escapeHtml(value || '')}</textarea></label>`;
      }

      function selectField(id, label, selected, values) {
        return `<label><span>${escapeHtml(label)}</span><select id="task-field-${escapeAttr(id)}">${(values || []).map(value => option(value, value, selected || '')).join('')}</select></label>`;

      function stoneIdsField(taskType, stones) {
        const ids = suggestedStoneIds(taskType, stones);
        const rows = ids.map(id => {
          const stone = (stones || []).filter(row => stoneId(row) === id)[0] || {};
          return [id, stone.Shape, stone.Carat ? stone.Carat + 'ct' : '', stone.OrderStatus || stone.ReturnStatus].filter(Boolean).join(' | ');
        });
        return `${textareaField('stoneIds', 'Stone IDs', ids.join('\n'))}${rows.length ? `<div class="template-box">${escapeHtml(rows.join('\n'))}</div>` : ''}`;
      }

      function pickFields(fields) {
        return (fields || []).reduce((payload, field) => {
          payload[field] = fieldValue(field);
          return payload;
        }, {});
      }

      function fieldValue(id) {
        const element = document.getElementById('task-field-' + id);
        return element ? String(element.value || '').trim() : '';
      }

      function parseTokenList(value) {
        return String(value || '').split(/[\n,;]/).map(token => token.trim()).filter((token, index, all) => token && all.indexOf(token) === index);
      }

      function parseDecisionLines(value) {
        return String(value || '').split(/\n/).map(line => line.trim()).filter(Boolean).map(line => {
          const pipe = line.split('|').map(part => part.trim());
          if (pipe.length >= 2) return { CertNo: pipe[0], Decision: pipe[1], Notes: pipe.slice(2).join(' | ') };
          const colon = line.indexOf(':');
          if (colon !== -1) return { CertNo: line.slice(0, colon).trim(), Decision: line.slice(colon + 1).trim() };
          return { CertNo: line, Decision: '' };
        }).filter(row => row.CertNo || row.Decision);
      }

      function suggestedStoneIds(taskType, stones) {
        const rows = (stones || []).filter(row => {
          if (taskType === 'ORDER_DIAMONDS') return row.OrderStatus === 'Proposing';
          if (taskType === 'TRACK_DIAMONDS' || taskType === 'CONFIRM_DIAMOND_DELIVERY') return row.OrderStatus === 'On the Way';
          if (taskType === 'RECORD_DIAMOND_DECISIONS') return row.OrderStatus === 'Delivered' || row.StoneStatus === 'In Stock';
          if (taskType === 'RETURN_DIAMONDS') return row.ReturnStatus === 'Return Due' || row.ReturnStatus === 'Return Overdue' || isOverdue(row.ReturnDueDate);
          return true;
        });
        const source = rows.length ? rows : stones || [];
        return source.map(stoneId).filter(Boolean);
      }

      function stoneId(row) {
        return row && (row.CertNo || row.StoneID || row.StoneId || row.stoneId) || '';
      }

      async function taskMutation(name, args, taskId, retried) {
        const response = await server(name, ...args);
        if (response && response.retry === true && !retried) {
          setTaskMessage('Retrying after lock contention', false);
          await delay(1000);
          return taskMutation(name, args, taskId, true);
        }
        if (response && response.conflict === true) {
          setTaskMessage('Task changed. Reloading latest detail.', true);
          setStatus('Conflict');
          await showTask(taskId);
          const error = new Error(errorMessage(response));
          error.conflict = true;
          throw error;
        }
        if (!response || !response.ok) {
          throw new Error(errorMessage(response));
        }
        return response;
      }

      function setTaskMessage(message, isError) {

        if (!value) return '';

        if (!taskId) return '';
        return `

            <button class="btn small" data-artifact-action="sync" data-task="${escapeAttr(taskId)}" data-root="${escapeAttr(rootId)}">Poll Uploads</button>
            <button class="btn small" data-artifact-action="brief" data-task="${escapeAttr(taskId)}" data-root="${escapeAttr(rootId)}">Artifact Brief</button>
          </div>
          <div id="artifact-output" class="status-line"></div>`;

      async function runArtifactAction(action, taskId, rootId) {
        const output = document.getElementById('artifact-output');
        if (output) output.textContent = 'Working';
        if (state.uploadPoll) {
          window.clearInterval(state.uploadPoll);
          state.uploadPoll = null;
        }
        if (action === 'folder') {
          const response = await requireOk(server('webArtifactUploadFolder', taskId, 'recording', state.token));
          const data = response.data || {};
          const href = safeHref(data.folderUrl);
          if (output) output.innerHTML = href ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener">Open Drive folder</a>` : 'Folder ready';
          return;
        }
        if (action === 'brief') {
          const response = await requireOk(server('webArtifactBrief', rootId, state.token));
          const data = response.data || {};
          if (output) output.textContent = data.aiBrief || data.brief || 'Brief loaded';
          return;
        }
        state.uploadPollStartedAt = Date.now();
        state.uploadPollTaskId = taskId;
        const shouldContinue = await pollDriveUploads(taskId, output, 1);
        if (shouldContinue && !state.uploadPoll) {
          state.uploadPoll = window.setInterval(() => pollDriveUploads(taskId, output, 0), 20000);
        }
      }

      async function pollDriveUploads(taskId, output, firstRun) {
        if (state.uploadPollTaskId && state.uploadPollTaskId !== taskId) return false;
        if (state.uploadPollStartedAt && Date.now() - state.uploadPollStartedAt > 10 * 60 * 1000) {
          if (output) output.textContent = 'Upload polling stopped after 10 minutes';
          clearUploadPoll();
          return false;
        }
        const response = await requireOk(server('webArtifactSyncDriveUploads', taskId, state.token));
        const count = response.data && response.data.count || 0;
        if (output) output.textContent = (firstRun ? 'Registered ' : 'Polling. Registered ') + count + ' new upload' + (count === 1 ? '' : 's') + latestTimingLabel();
        if (count > 0) clearUploadPoll();
        return count === 0;
      }

      function clearUploadPoll() {
        if (state.uploadPoll) {
          window.clearInterval(state.uploadPoll);
        }
        state.uploadPoll = null;
        state.uploadPollStartedAt = 0;
        state.uploadPollTaskId = '';
      }

      function calendarGrid(monthKey, days) {
        const first = new Date(monthKey + '-01T00:00:00');
        const start = new Date(first.getFullYear(), first.getMonth(), 1 - first.getDay());
        const cells = [];
        const todayKey = dateKey(new Date());
        const weekday = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(label => `<div class="calendar-weekday">${label}</div>`).join('');
        for (let index = 0; index < 42; index += 1) {
          const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
          const key = dateKey(date);
          const rows = days[key] || [];
          const classes = ['day'];
          if (date.getMonth() !== first.getMonth()) classes.push('outside');
          if (key === todayKey) classes.push('today');
          cells.push(`<div class="${classes.join(' ')}">
            <div class="day-num">${date.getDate()}</div>
            ${rows.slice(0, 4).map(appt => `<button class="appt" type="button" data-calendar-appt="${escapeAttr(appt.apptId || appt.rootApptId || '')}">
              <span class="meta">${escapeHtml(formatTime(appt.time || appt.start || ''))}</span><br>
              ${escapeHtml(appt.customerName || appt.visitType || appt.apptId || '')}
            </button>`).join('')}
            ${rows.length > 4 ? `<div class="appt muted">+${rows.length - 4} more</div>` : ''}
          </div>`);
        }
        return `<div class="calendar-days">${weekday}${cells.join('')}</div>`;
      }

      function bindPaymentActions() {

      async function runPaymentAction(action, paymentId, version) {
        if (!paymentId) return;
        setStatus('Updating payment');
        if (action === 'links') {
          const response = await requireOk(server('webPaymentDocLinks', paymentId, state.token));
          const data = response.data || {};
          setStatus((safeHref(data.docUrl) || safeHref(data.pdfUrl) || 'Links loaded') + latestTimingLabel());
          return;
        }
        if (action === 'export') await requireOk(server('webPaymentExportPdf', paymentId, state.token));
        if (action === 'regen') await requireOk(server('webPaymentRegenerateDoc', paymentId, version ? Number(version) : null, state.token));
        if (action === 'void') await requireOk(server('webPaymentAdminVoid', paymentId, 'Voided from dashboard', version ? Number(version) : null, state.token));
        await loadPaymentHistory();
      }

      function keyValueTable(object) {
        const rows = Object.keys(object || {});
        if (!rows.length) return `<div class="empty"><h3>No data</h3></div>`;
        return `<table><tbody>${rows.map(key => `<tr><td>${escapeHtml(key)}</td><td class="number">${escapeHtml(object[key])}</td></tr>`).join('')}</tbody></table>`;
      }

      function userTable(rows) {
        if (!rows.length) return `<div class="empty"><h3>No active users</h3></div>`;
        return `<div class="mini-table">${rows.map(row => {
          const roles = Array.isArray(row.roles) ? row.roles : rolesFromCsv(row.RolesCsv || row.rolesCsv || '');
          return `<div class="mini-row"><div><strong>${escapeHtml(row.Name || row.name || row.Email || row.email || '')}</strong><div class="meta">${escapeHtml(row.Email || row.email || '')}</div></div><div class="meta">${escapeHtml(roles.join(', '))}</div></div>`;
        }).join('')}</div>`;
      }

      function opsTable(rows) {
        if (!rows.length) return `<div class="empty"><h3>No recent operations</h3></div>`;
        return `<table><thead><tr><th>Time</th><th>Function</th><th>Result</th><th>Message</th></tr></thead><tbody>${rows.slice(0, 25).map(row => `<tr><td>${escapeHtml(fmtDate(row.Timestamp))}</td><td>${escapeHtml(row.FunctionName || '')}</td><td>${escapeHtml(row.Result || '')}</td><td>${escapeHtml(row.Message || '')}</td></tr>`).join('')}</tbody></table>`;
      }

      function benchmarkTable(rows) {
        if (!rows.length) return `<div class="empty"><h3>No metrics returned</h3></div>`;
        return `<table><thead><tr><th>Metric</th><th>Result</th><th>Elapsed</th><th>Source</th></tr></thead><tbody>${rows.map(row => `<tr><td>${escapeHtml(row.name || '')}</td><td>${row.ok ? 'OK' : 'ERR'}</td><td class="number">${escapeHtml(row.elapsedMs || '')} ms</td><td>${escapeHtml(row.source || '')}</td></tr>`).join('')}</tbody></table>`;
      }

      function triggerTable(rows) {
        if (!rows.length) return `<div class="empty"><h3>No installed triggers</h3></div>`;
        return `<table><thead><tr><th>Handler</th><th>Event</th><th>Source</th><th>Managed</th></tr></thead><tbody>${rows.map(row => `<tr><td>${escapeHtml(row.handler || '')}</td><td>${escapeHtml(row.eventType || '')}</td><td>${escapeHtml(row.source || '')}</td><td>${row.launchManaged ? 'Yes' : 'No'}</td></tr>`).join('')}</tbody></table>`;
      }

      function pipelineCards(object) {
        const rows = Object.keys(object || {});
        if (!rows.length) return `<div class="empty"><h3>No data</h3></div>`;
        return `<div class="list-stack">${rows.map(key => `<div class="activity-card"><div class="card-top"><div class="card-title">${escapeHtml(key)}</div><div class="stat-value number">${escapeHtml(object[key])}</div></div></div>`).join('')}</div>`;
      }

      function taskViewOptions(selected) {
        const visible = state.visibleViews || [];
        const options = [{ value: 'mine', label: 'Mine' }];
        if (visible.indexOf('jocCoverage') !== -1) options.push({ value: 'coverage', label: 'Coverage' });
        if (visible.indexOf('cleanup') !== -1) options.push({ value: 'cleanup', label: 'Cleanup' });
        if (visible.indexOf('adminReview') !== -1 || visible.indexOf('admin') !== -1) options.push({ value: 'admin', label: 'All Open' });
        return options.map(item => option(item.value, item.label, selected)).join('');
      }

      function uniqueValues(values) {
        const seen = {};
        return (values || []).map(value => String(value || '').trim()).filter(value => {
          const key = value.toLowerCase();
          if (!value || seen[key]) return false;
          seen[key] = true;
          return true;
        });
      }

      function brandChip(brand) {
        const code = brandCode(brand);
        if (!code) return '';
        return `<span class="brand-chip ${code === 'HP' ? 'hp' : 'vvs'}">${escapeHtml(code)}</span>`;
      }

      function brandCode(brand) {
        let value = String(brand || '').toUpperCase();
        if (value.normalize) value = value.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        value = value.replace(/[^A-Z0-9]+/g, ' ');
        if (/\bVVS\b/.test(value) || value.indexOf('VVS JEWELRY') >= 0) return 'VVS';
        if (/\bHP\b/.test(value) || value.indexOf('HPUSA') >= 0 || value.indexOf('HUNG PHAT') >= 0) return 'HP';
        return '';
      }

      function taskTypeLabel(value) {
        return String(value || '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim() || 'Task';
      }

      function isOverdue(value) {
        if (!value) return false;
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return false;
        return date.getTime() < Date.now();
      }

      function diamondTitle(row) {
        row = row || {};
        return [row.Shape, row.Carat ? row.Carat + 'ct' : '', row.Color, row.Clarity, row.CertNo ? 'Cert ' + row.CertNo : ''].filter(Boolean).join(' | ') || row.StoneID || row.StoneId || 'Diamond';
      }

      function diamondIssue(row, mode) {
        row = row || {};
        if (mode === 'inventory' && isOverdue(row.ReturnDueDate)) return 'Return overdue';
        if (mode === 'tracking' && !row.TrackingETA) return 'Missing ETA';
        if (/delayed|cancel|concern|unavailable/i.test(String(row.TrackingStatus || ''))) return row.TrackingStatus;
        if (!row.AssignedRootApptID && !row.RootApptID && mode === 'inventory') return 'Unassigned';
        return '';
      }

      function customerLinksHtml(identity, links, order3d) {
        identity = identity || {};
        links = links || {};
        order3d = order3d || {};
        const linkRows = [
          ['Customer Folder', identity.customerFolderUrl],
          ['Appointment Folder', links.appointmentFolderUrl],
          ['Odoo SO', order3d.OdooUrl || order3d.odooUrl],
          ['3D Tracker', order3d.TrackerUrl || order3d.trackerUrl]
        ];
        (links.recordingUrls || []).forEach((url, index) => linkRows.push(['Recording ' + (index + 1), url]));
        (links.transcriptUrls || []).forEach((url, index) => linkRows.push(['Transcript ' + (index + 1), url]));
        (links.summaryUrls || []).forEach((url, index) => linkRows.push(['Summary ' + (index + 1), url]));
        const safeLinks = linkRows.map(link => ({ label: link[0], href: safeHref(link[1]) })).filter(link => link.href);
        return `
          <div class="detail-section">
            <div class="eyebrow">References</div>
            ${safeLinks.length ? `<div class="link-list" style="margin-top:12px">${safeLinks.map(link => `<a class="link-tile" href="${escapeAttr(link.href)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a>`).join('')}</div>` : '<div class="empty" style="margin-top:12px">No safe links available for this customer.</div>'}
          </div>`;
      }

      function rolesFromCsv(value) {
        if (Array.isArray(value)) return value;
        return String(value || '').split(/[,\n;]/).map(role => role.trim()).filter(Boolean);
      }

      function monthLabel(monthKey) {
        const date = new Date(String(monthKey || currentMonthKey()) + '-01T00:00:00');
        if (Number.isNaN(date.getTime())) return String(monthKey || '');
        return date.toLocaleDateString([], { month: 'long', year: 'numeric' });
      }

      function shiftMonthKey(monthKey, delta) {
        const date = new Date(String(monthKey || currentMonthKey()) + '-01T00:00:00');
        date.setMonth(date.getMonth() + Number(delta || 0));
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
      }

      function dateKey(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }

      function countCalendarEvents(days) {
        return Object.keys(days || {}).reduce((sum, key) => sum + ((days[key] || []).length), 0);
      }

      function formatTime(value) {
        const text = String(value || '').trim();
        if (!text) return '';
        const match = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i.exec(text);
        if (!match) {
          const date = new Date(text);
          return Number.isNaN(date.getTime()) ? text : date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }
        let hour = Number(match[1]);
        const minute = match[2];
        const suffix = match[3];
        if (suffix) return ((hour - 1) % 12 + 1) + ':' + minute + ' ' + suffix.toLowerCase();
        const ampm = hour < 12 ? 'am' : 'pm';
        hour = (hour % 12) || 12;
        return hour + ':' + minute + ' ' + ampm;
      }

      function metric(label, value) {
        return `<div class="metric"><span class="eyebrow">${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
      }

      function detailRow(label, value) {
        return `<div class="detail-row"><span>${escapeHtml(label)}</span><span>${escapeHtml(value || '')}</span></div>`;
      }

      function emptyPanel(label) {
        return `<div class="empty"><h3>${escapeHtml(label)}</h3></div>`;
      }

      function option(value, label, selected) {
        return `<option value="${escapeAttr(value)}" ${value === selected ? 'selected' : ''}>${escapeHtml(label)}</option>`;
      }

      function setContent(html, isLoading) {
        const element = document.getElementById('content');
        if (!element) return;
        element.innerHTML = html;
        element.classList.toggle('loading', Boolean(isLoading));
      }

      function setStatus(text) {
        state.status = text || '';
        const element = document.getElementById('status');
        if (element) element.textContent = state.status;
      }

      function setBusy(value, text) {
        state.busy = Boolean(value);
        if (text) setStatus(text);
      }

      async function requireOk(promise) {
        const response = await promise;
        if (!response || !response.ok) {
          throw new Error(errorMessage(response));
        }
        return response;
      }

      function errorMessage(response) {
        return response && response.error && response.error.message || response && response.reason || 'Request failed';
      }

      function effectiveViews(baseViews, permissions) {
        let views = (baseViews || []).map(canonicalView);
        if (hasPermission(permissions, 'Api.diamonds.bulkReturnCandidates')) views = views.concat(DIAMOND_VIEWS);
        if (hasPermission(permissions, 'Api.admin.dashboard')) views = views.concat(ADMIN_VIEWS);
        views = views.map(canonicalView);
        return views.filter((view, index, all) => {
          if (all.indexOf(view) !== index) return false;
          const permission = VIEW_PERMISSIONS[view];
          return !permission || hasPermission(permissions, permission);
        });
      }

      function canonicalView(view) {
        return VIEW_ALIASES[view] || view;
      }

      function hasPermission(permissions, apiName) {
        if (!permissions) return false;
        if (permissions[apiName] === true) return true;
        if (Array.isArray(permissions)) return permissions.indexOf(apiName) !== -1;
        return Boolean(permissions[apiName]);
      }

      function recordTiming(name, started, response, error) {
        const elapsedMs = Math.round(performance.now() - started);
        state.clientTimings.unshift({
          name,
          elapsedMs,
          ok: !error && (!response || response.ok !== false),
          serverMs: response && response.ageMs
        });
        state.clientTimings = state.clientTimings.slice(0, 20);
        if (name !== 'webDiagnosticsLogClientTiming' && (name === 'webBootstrap' || name === 'webLogin' || name === 'webDiagnosticsBenchmarks')) {
          sendClientTiming(name, elapsedMs, response, error);
        }
      }

      function latestTimingLabel() {
        const timing = state.clientTimings[0];
        if (!timing) return '';
        return ' | ' + timing.name + ' ' + timing.elapsedMs + ' ms';
      }

      function sendClientTiming(name, elapsedMs, response, error) {
        if (!state.token || !window.google || !google.script || !google.script.run) return;
        const payload = {
          view: state.view,
          route: name,
          metrics: {
            elapsedMs,
            serverMs: response && response.ageMs || null,
            ok: !error && (!response || response.ok !== false)
          },
          userAgent: navigator.userAgent || ''
        };
        google.script.run.webDiagnosticsLogClientTiming(payload, state.token);
      }

      function titleForView(view) {
        return {
          tasks: 'Work Queue',
          myQueue: 'Work Queue',
          coverage: 'JOC Coverage',
          jocCoverage: 'JOC Coverage',
          cleanup: 'Cleanup Queue',
          customers: 'Customer Records',
          customerSearch: 'Customer Records',
          customerPipeline: 'Customer Pipeline',
          calendar: 'Appointment Calendar',
          diamonds: 'Diamond Operations',
          diamondInventory: 'Diamond Inventory',
          diamondTracking: 'Diamond Tracking',
          bulkReturns: 'Bulk Diamond Returns',
          payments: 'Payment History',
          admin: 'Administrative Health',
          adminReview: 'Admin Review',
          schedules: 'Schedules',
          users: 'Manage Users',
          manageUsers: 'Manage Users',
          diagnostics: 'Diagnostics'
        }[view] || titleCase(view);
      }

      function titleCase(value) {
        return String(value || '').replace(/(^|\\s)\\S/g, match => match.toUpperCase());
      }

      function currentMonthKey() {
        const today = new Date();
        return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');
      }

      function fmtDate(value) {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      }

      function money(value) {
        const number = Number(value || 0);
        return '$' + number.toFixed(2);
      }

      function paymentLine(finance) {
        if (!finance) return '';
        if (finance.available === false) return finance.reason || 'Unavailable';
        return 'Balance ' + money(finance.balance || 0);
      }

      function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      function safeHref(value) {
        const url = String(value || '').trim();
        if (!url) return '';
        try {
          const parsed = new URL(url, window.location.href);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return parsed.href;
          }
        } catch (error) {
          return '';
        }
        return '';
      }
    </script>
  </body>
</html>
